<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de campo - PROEZA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100%; width: 100%; }

    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: white; padding: 12px; border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
      width: 330px; max-width: calc(100% - 30px); font-size: 13px;
    }

    .panel h3 { margin: 0 0 6px 0; font-size: 17px; color: #111; }

    .buscador {
      width: 100%; box-sizing: border-box; padding: 9px;
      margin-top: 9px; border: 1px solid #aaa; border-radius: 7px;
      font-size: 14px;
    }

    .botones { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    .boton {
      border: none; border-radius: 7px; padding: 8px 10px;
      font-weight: bold; cursor: pointer; background: #eeeeee; color: #111;
    }

    .boton-activo { background: #1a73e8; color: white; }

    .resultados {
      max-height: 180px; overflow-y: auto; margin-top: 8px;
      border-top: 1px solid #ddd; display: none; background: #fff;
    }

    .item-resultado {
      padding: 8px 4px; border-bottom: 1px solid #eee;
      cursor: pointer; line-height: 1.35;
    }

    .item-resultado:hover { background: #f1f1f1; }

    .popup-card {
      min-width: 260px; max-width: 320px; color: #111;
      font-size: 13px; line-height: 1.45;
    }

    .popup-card h3 {
      margin: 0 0 8px 0; font-size: 17px; color: #111; line-height: 1.2;
    }

    .popup-badge {
      display: inline-block; padding: 4px 9px; border-radius: 14px;
      font-weight: bold; margin-bottom: 8px; font-size: 12px;
    }

    .badge-vivienda { background: #fdd835; color: #111; }
    .badge-parcela { background: #f4511e; color: white; }
    .badge-poligono { background: #2e7d32; color: white; }

    .popup-grid {
      border-top: 1px solid #ddd; margin-top: 6px; padding-top: 6px;
    }

    .popup-grid div { margin-bottom: 3px; }

    .btn-ruta {
      display: block; background: #1a73e8 !important; color: #ffffff !important;
      padding: 10px 12px; border-radius: 8px; text-decoration: none !important;
      font-weight: bold; margin-top: 10px; text-align: center; font-size: 14px;
    }

    .btn-ruta:visited, .btn-ruta:hover, .btn-ruta:active {
      color: #ffffff !important; text-decoration: none !important;
    }

    .leaflet-popup-content-wrapper {
      background: white !important; color: #111 !important;
      border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    .leaflet-popup-content { margin: 14px; }

    .label-nombre {
      background: rgba(255,255,255,0.92); border: 1px solid #555;
      border-radius: 4px; padding: 2px 4px; font-size: 11px;
      font-weight: bold; color: #111; white-space: nowrap;
    }

    .mi-ubicacion-btn {
      position: absolute; right: 12px; bottom: 28px; z-index: 1000;
      background: white; border: none; border-radius: 9px;
      padding: 11px 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      font-weight: bold; cursor: pointer;
    }

    @media (max-width: 600px) {
      .panel { width: 290px; font-size: 12px; }
      .panel h3 { font-size: 15px; }
      .popup-card { min-width: 230px; max-width: 270px; }
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <h3>Mapa de campo</h3>
  <div><b>CSV:</b> <span id="nombreCSV">Cargando...</span></div>
  <div><b>KML:</b> <span id="nombreKML">Sin KML</span></div>
  <div id="resumen">Cargando datos...</div>

  <input id="buscador" class="buscador" type="text" placeholder="Buscar por nombre, cédula o comunidad">

  <div class="botones">
    <button id="btnViviendas" class="boton boton-activo">🏠 Viviendas</button>
    <button id="btnParcelas" class="boton boton-activo">🟠 Parcelas</button>
    <button id="btnKML" class="boton boton-activo">🟩 Polígonos</button>
  </div>

  <div style="margin-top:8px;">
    🏠 Vivienda<br>
    🟠 P Parcela<br>
    🟩 Polígono KML<br>
    🔵 Mi ubicación
  </div>

  <div id="resultados" class="resultados"></div>
</div>

<button class="mi-ubicacion-btn" onclick="centrarMiUbicacion()">📍 Mi ubicación</button>

<script>
  const params = new URLSearchParams(window.location.search);

  const archivoCSV = params.get("csv") || "ALTO VERA_A.csv";
  const archivoKML = params.get("kml") || "";

  document.getElementById("nombreCSV").textContent = archivoCSV;
  document.getElementById("nombreKML").textContent = archivoKML || "Sin KML";

  const map = L.map('map').setView([-24.4, -56.4], 12);

  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
  ).addTo(map);

  L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '' }
  ).addTo(map);

  const capaViviendas = L.featureGroup().addTo(map);
  const capaParcelas = L.featureGroup().addTo(map);
  const capaKML = L.featureGroup().addTo(map);
  const todosLosPuntos = L.featureGroup().addTo(map);

  let registrosBusqueda = [];
  let ubicacionActual = null;
  let marcadorUsuario = null;
  let totalPoligonos = 0;

  const iconoVivienda = L.divIcon({
    html: `<div style="width:30px;height:30px;border-radius:50%;background:#fdd835;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 1px 5px rgba(0,0,0,0.55);">🏠</div>`,
    className: "", iconSize: [30, 30], iconAnchor: [15, 15]
  });

  const iconoParcela = L.divIcon({
    html: `<div style="width:32px;height:32px;border-radius:50%;background:#f4511e;border:2px solid white;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:18px;box-shadow:0 1px 5px rgba(0,0,0,0.55);">P</div>`,
    className: "", iconSize: [32, 32], iconAnchor: [16, 16]
  });

  function limpiarValor(valor) {
    if (valor === undefined || valor === null) return "";
    return String(valor).trim();
  }

  function get(row, nombre) {
    if (row[nombre] !== undefined) return row[nombre];
    const buscado = nombre.trim().toLowerCase();
    const clave = Object.keys(row).find(k => k.trim().toLowerCase() === buscado);
    return clave ? row[clave] : "";
  }

  function convertirNumero(valor) {
    if (valor === undefined || valor === null || valor === "") return null;
    let texto = String(valor).trim().replace(",", ".");
    const num = parseFloat(texto);
    if (isNaN(num)) return null;
    return num;
  }

  function crearPopup(row, tipo, lat, lon) {
    const nombre = limpiarValor(get(row, "Nombres y Apellidos"));
    const cedula = limpiarValor(get(row, "Cédula"));
    const comunidad = limpiarValor(get(row, "Comunidad"));
    const modelo = limpiarValor(get(row, "Modelo"));
    const departamento = limpiarValor(get(row, "Departamento"));
    const distrito = limpiarValor(get(row, "Distrito"));
    const localidad = limpiarValor(get(row, "Localidad"));
    const telefono = limpiarValor(get(row, "Teléfono"));
    const empresa = limpiarValor(get(row, "Empresa"));
    const lote = limpiarValor(get(row, "Lote"));
    const estadoParticipante = limpiarValor(get(row, "Estado del participante"));
    const estadoMonitoreo = limpiarValor(get(row, "Estado monitoreo"));
    const prioridad = limpiarValor(get(row, "Prioridad"));
    const superficie = limpiarValor(get(row, "Superficie (Ha.)"));

    const urlRuta = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
    const badge = tipo === "Vivienda" ? "badge-vivienda" : "badge-parcela";

    return `
      <div class="popup-card">
        <span class="popup-badge ${badge}">${tipo}</span>
        <h3>${nombre}</h3>
        <div class="popup-grid">
          <div><b>Cédula:</b> ${cedula}</div>
          <div><b>Comunidad:</b> ${comunidad}</div>
          <div><b>Departamento:</b> ${departamento}</div>
          <div><b>Distrito:</b> ${distrito}</div>
          <div><b>Localidad:</b> ${localidad}</div>
          <div><b>Teléfono:</b> ${telefono}</div>
          <div><b>Modelo:</b> ${modelo}</div>
          <div><b>Superficie:</b> ${superficie}</div>
          <div><b>Empresa:</b> ${empresa}</div>
          <div><b>Lote:</b> ${lote}</div>
          <div><b>Estado participante:</b> ${estadoParticipante}</div>
          <div><b>Estado monitoreo:</b> ${estadoMonitoreo}</div>
          <div><b>Prioridad:</b> ${prioridad}</div>
        </div>
        <a class="btn-ruta" target="_blank" href="${urlRuta}">🧭 Cómo llegar</a>
      </div>
    `;
  }

  function agregarEtiqueta(marker, texto) {
    marker.bindTooltip(texto, {
      permanent: false,
      direction: "top",
      offset: [0, -12],
      className: "label-nombre"
    });
  }

  function agregarPunto(row, tipo, lat, lon, icono, capa) {
    const nombre = limpiarValor(get(row, "Nombres y Apellidos"));
    const cedula = limpiarValor(get(row, "Cédula"));
    const comunidad = limpiarValor(get(row, "Comunidad"));

    const marker = L.marker([lat, lon], { icon: icono }).addTo(capa);
    marker.bindPopup(crearPopup(row, tipo, lat, lon));
    agregarEtiqueta(marker, `${nombre} - ${tipo}`);

    todosLosPuntos.addLayer(marker);

    registrosBusqueda.push({
      texto: `${nombre} ${cedula} ${comunidad} ${tipo}`.toLowerCase(),
      nombre, cedula, comunidad, tipo, lat, lon, marker
    });
  }

  function actualizarResumen(totalViviendas, totalParcelas) {
    document.getElementById("resumen").innerHTML =
      `<b>Viviendas:</b> ${totalViviendas}<br>` +
      `<b>Parcelas:</b> ${totalParcelas}<br>` +
      `<b>Polígonos KML:</b> ${totalPoligonos}`;
  }

  let totalViviendasGlobal = 0;
  let totalParcelasGlobal = 0;

  Papa.parse(archivoCSV, {
    download: true,
    header: true,
    skipEmptyLines: true,
    delimiter: "",
    complete: function(results) {
      const datos = results.data;

      datos.forEach(row => {
        const latViv = convertirNumero(get(row, "Vivienda_Latitud"));
        const lonViv = convertirNumero(get(row, "Vivienda_Longitud"));

        if (latViv !== null && lonViv !== null) {
          agregarPunto(row, "Vivienda", latViv, lonViv, iconoVivienda, capaViviendas);
          totalViviendasGlobal++;
        }

        const latPar = convertirNumero(get(row, "Parcela_Latitud"));
        const lonPar = convertirNumero(get(row, "Parcela_Longitud"));

        if (latPar !== null && lonPar !== null) {
          agregarPunto(row, "Parcela", latPar, lonPar, iconoParcela, capaParcelas);
          totalParcelasGlobal++;
        }
      });

      actualizarResumen(totalViviendasGlobal, totalParcelasGlobal);
      ajustarVistaGeneral();
    },
    error: function(error) {
      alert("No se pudo leer el CSV. Verificá que el archivo indicado exista en GitHub.");
      console.error(error);
    }
  });

  function cargarKML() {
    if (!archivoKML) return;

    const kmlLayer = omnivore.kml(archivoKML)
      .on('ready', function() {
        kmlLayer.eachLayer(function(layer) {
          totalPoligonos++;

          if (layer.setStyle) {
            layer.setStyle({
              color: "#2e7d32",
              weight: 3,
              fillColor: "#66bb6a",
              fillOpacity: 0.25
            });
          }

          let nombrePoligono = "Polígono de plantación";
          if (layer.feature && layer.feature.properties && layer.feature.properties.name) {
            nombrePoligono = layer.feature.properties.name;
          }

          layer.bindPopup(`
            <div class="popup-card">
              <span class="popup-badge badge-poligono">Polígono KML</span>
              <h3>${nombrePoligono}</h3>
              <div class="popup-grid">
                <div><b>Archivo:</b> ${archivoKML}</div>
              </div>
            </div>
          `);

          capaKML.addLayer(layer);
          todosLosPuntos.addLayer(layer);
        });

        actualizarResumen(totalViviendasGlobal, totalParcelasGlobal);
        ajustarVistaGeneral();
      })
      .on('error', function(e) {
        alert("No se pudo leer el KML. Verificá que el archivo indicado exista en GitHub.");
        console.error(e);
      });
  }

  cargarKML();

  function ajustarVistaGeneral() {
    if (todosLosPuntos.getLayers().length > 0) {
      map.fitBounds(todosLosPuntos.getBounds(), { padding: [45, 45] });
    }
  }

  document.getElementById("btnViviendas").addEventListener("click", function() {
    if (map.hasLayer(capaViviendas)) {
      map.removeLayer(capaViviendas);
      this.classList.remove("boton-activo");
    } else {
      map.addLayer(capaViviendas);
      this.classList.add("boton-activo");
    }
  });

  document.getElementById("btnParcelas").addEventListener("click", function() {
    if (map.hasLayer(capaParcelas)) {
      map.removeLayer(capaParcelas);
      this.classList.remove("boton-activo");
    } else {
      map.addLayer(capaParcelas);
      this.classList.add("boton-activo");
    }
  });

  document.getElementById("btnKML").addEventListener("click", function() {
    if (map.hasLayer(capaKML)) {
      map.removeLayer(capaKML);
      this.classList.remove("boton-activo");
    } else {
      map.addLayer(capaKML);
      this.classList.add("boton-activo");
    }
  });

  document.getElementById("buscador").addEventListener("input", function() {
    const valor = this.value.trim().toLowerCase();
    const contenedor = document.getElementById("resultados");
    contenedor.innerHTML = "";

    if (valor.length < 2) {
      contenedor.style.display = "none";
      return;
    }

    const encontrados = registrosBusqueda.filter(r => r.texto.includes(valor)).slice(0, 12);

    encontrados.forEach(r => {
      const div = document.createElement("div");
      div.className = "item-resultado";
      div.innerHTML = `<b>${r.nombre}</b><br>${r.tipo} | CI: ${r.cedula}<br>${r.comunidad}`;
      div.onclick = function() {
        map.setView([r.lat, r.lon], 17);
        r.marker.openPopup();
        contenedor.style.display = "none";
      };
      contenedor.appendChild(div);
    });

    contenedor.style.display = encontrados.length > 0 ? "block" : "none";
  });

  map.locate({ setView: false, watch: true, enableHighAccuracy: true });

  map.on('locationfound', function(e) {
    ubicacionActual = e.latlng;

    if (marcadorUsuario) {
      marcadorUsuario.setLatLng(e.latlng);
    } else {
      marcadorUsuario = L.circleMarker(e.latlng, {
        radius: 8,
        color: "#1a73e8",
        fillColor: "#1a73e8",
        fillOpacity: 0.9,
        weight: 3
      }).addTo(map).bindPopup("Mi ubicación actual");
    }
  });

  function centrarMiUbicacion() {
    if (ubicacionActual) {
      map.setView(ubicacionActual, 17);
      if (marcadorUsuario) marcadorUsuario.openPopup();
    } else {
      alert("Todavía no se pudo obtener tu ubicación. Permití el acceso a ubicación en el navegador.");
    }
  }
</script>

</body>
</html>
