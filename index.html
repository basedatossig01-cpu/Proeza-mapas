<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de campo - PROEZA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- PapaParse para leer CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      max-width: 320px;
      font-size: 13px;
    }

    .panel h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
    }

    .leyenda {
      margin-top: 6px;
      line-height: 1.6;
    }

    .btn-ruta {
      display: inline-block;
      background: #1a73e8;
      color: white;
      padding: 7px 10px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 6px;
    }

    .label-nombre {
      background: rgba(255,255,255,0.85);
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 11px;
      font-weight: bold;
      color: #111;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <h3>Mapa de campo</h3>
  <div><b>Archivo:</b> ALTO_VERA_A.csv</div>
  <div class="leyenda">
    🏠 Vivienda<br>
    🟠 P Parcela
  </div>
</div>

<script>
  // ==========================
  // CONFIGURACIÓN
  // ==========================

  const archivoCSV = "ALTO_VERA_A.csv";

  // ==========================
  // MAPA BASE
  // ==========================

  const map = L.map('map').setView([-24.4, -56.4], 12);

  // Imagen satelital ESRI
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }
  ).addTo(map);

  // Etiquetas/caminos sobre imagen satelital
  L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {
      maxZoom: 19,
      attribution: ''
    }
  ).addTo(map);

  // ==========================
  // ICONOS
  // ==========================

  const iconoVivienda = L.divIcon({
    html: `<div style="
      width:28px;
      height:28px;
      border-radius:50%;
      background:#fdd835;
      border:2px solid white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      box-shadow:0 1px 4px rgba(0,0,0,0.45);
    ">🏠</div>`,
    className: "",
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });

  const iconoParcela = L.divIcon({
    html: `<div style="
      width:30px;
      height:30px;
      border-radius:50%;
      background:#f4511e;
      border:2px solid white;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:bold;
      font-size:17px;
      box-shadow:0 1px 4px rgba(0,0,0,0.45);
    ">P</div>`,
    className: "",
    iconSize: [30, 30],
    iconAnchor: [15, 15]
  });

  // ==========================
  // FUNCIONES
  // ==========================

  function limpiarValor(valor) {
    if (valor === undefined || valor === null) return "";
    return String(valor).trim();
  }

  function convertirNumero(valor) {
    if (valor === undefined || valor === null) return null;

    let texto = String(valor).trim();

    // Corrige coma decimal si existiera
    texto = texto.replace(",", ".");

    const num = parseFloat(texto);

    if (isNaN(num)) return null;
    return num;
  }

  function crearPopup(row, tipo, lat, lon) {
    const nombre = limpiarValor(row["Nombres y Apellidos"]);
    const cedula = limpiarValor(row["Cédula"]);
    const comunidad = limpiarValor(row["Comunidad"]);
    const modelo = limpiarValor(row["Modelo"]);
    const departamento = limpiarValor(row["Departamento"]);
    const distrito = limpiarValor(row["Distrito"]);
    const localidad = limpiarValor(row["Localidad"]);
    const telefono = limpiarValor(row["Teléfono"]);
    const empresa = limpiarValor(row["Empresa"]);
    const lote = limpiarValor(row["Lote"]);
    const estadoParticipante = limpiarValor(row["Estado del participante"]);
    const estadoMonitoreo = limpiarValor(row["Estado monitoreo"]);
    const prioridad = limpiarValor(row["Prioridad"]);
    const superficie = limpiarValor(row["Superficie (Ha.)"]);

    const urlRuta = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

    return `
      <div style="min-width:230px; max-width:280px;">
        <h3 style="margin:0 0 6px 0;">${nombre}</h3>
        <b>Tipo:</b> ${tipo}<br>
        <b>Cédula:</b> ${cedula}<br>
        <b>Comunidad:</b> ${comunidad}<br>
        <b>Departamento:</b> ${departamento}<br>
        <b>Distrito:</b> ${distrito}<br>
        <b>Localidad:</b> ${localidad}<br>
        <b>Teléfono:</b> ${telefono}<br>
        <b>Modelo:</b> ${modelo}<br>
        <b>Superficie:</b> ${superficie}<br>
        <b>Empresa:</b> ${empresa}<br>
        <b>Lote:</b> ${lote}<br>
        <b>Estado participante:</b> ${estadoParticipante}<br>
        <b>Estado monitoreo:</b> ${estadoMonitoreo}<br>
        <b>Prioridad:</b> ${prioridad}<br>
        <a class="btn-ruta" target="_blank" href="${urlRuta}">Cómo llegar</a>
      </div>
    `;
  }

  function agregarEtiqueta(marker, texto) {
    marker.bindTooltip(texto, {
      permanent: false,
      direction: "top",
      offset: [0, -12],
      className: "label-nombre"
    });
  }

  // ==========================
  // CARGAR CSV
  // ==========================

  const grupoPuntos = L.featureGroup().addTo(map);

  Papa.parse(archivoCSV, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {

      const datos = results.data;
      let totalViviendas = 0;
      let totalParcelas = 0;

      datos.forEach(row => {
        const nombre = limpiarValor(row["Nombres y Apellidos"]);

        // Vivienda
        const latViv = convertirNumero(row["Vivienda_Latitud"]);
        const lonViv = convertirNumero(row["Vivienda_Longitud"]);

        if (latViv !== null && lonViv !== null) {
          const markerViv = L.marker([latViv, lonViv], { icon: iconoVivienda }).addTo(grupoPuntos);
          markerViv.bindPopup(crearPopup(row, "Vivienda", latViv, lonViv));
          agregarEtiqueta(markerViv, nombre + " - Vivienda");
          totalViviendas++;
        }

        // Parcela
        const latPar = convertirNumero(row["Parcela_Latitud"]);
        const lonPar = convertirNumero(row["Parcela_Longitud"]);

        if (latPar !== null && lonPar !== null) {
          const markerPar = L.marker([latPar, lonPar], { icon: iconoParcela }).addTo(grupoPuntos);
          markerPar.bindPopup(crearPopup(row, "Parcela", latPar, lonPar));
          agregarEtiqueta(markerPar, nombre + " - Parcela");
          totalParcelas++;
        }
      });

      if (grupoPuntos.getLayers().length > 0) {
        map.fitBounds(grupoPuntos.getBounds(), { padding: [30, 30] });
      }

      console.log("Viviendas cargadas:", totalViviendas);
      console.log("Parcelas cargadas:", totalParcelas);
    },
    error: function(error) {
      alert("No se pudo leer el CSV. Verificá que ALTO_VERA_A.csv esté en la misma carpeta que mapa.html");
      console.error(error);
    }
  });

  // ==========================
  // UBICACIÓN ACTUAL DEL TÉCNICO
  // ==========================

  map.locate({
    setView: false,
    watch: true,
    enableHighAccuracy: true
  });

  let marcadorUsuario = null;

  map.on('locationfound', function(e) {
    if (marcadorUsuario) {
      marcadorUsuario.setLatLng(e.latlng);
    } else {
      marcadorUsuario = L.circleMarker(e.latlng, {
        radius: 8,
        color: "#1a73e8",
        fillColor: "#1a73e8",
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Mi ubicación actual");
    }
  });

</script>

</body>
</html>
