<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de campo - PROEZA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100%; width: 100%; }
    .panel {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: white; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      max-width: 330px; font-size: 13px;
    }
    .panel h3 { margin: 0 0 6px 0; font-size: 15px; }
    .btn-ruta {
      display: inline-block; background: #1a73e8; color: white;
      padding: 7px 10px; border-radius: 5px; text-decoration: none;
      font-weight: bold; margin-top: 6px;
    }
    .label-nombre {
      background: rgba(255,255,255,0.85);
      border: 1px solid #555; border-radius: 4px;
      padding: 2px 4px; font-size: 11px; font-weight: bold;
      color: #111; white-space: nowrap;
    }
  </style>
</head>

<body>
<div id="map"></div>

<div class="panel">
  <h3>Mapa de campo</h3>
  <div><b>Archivo:</b> ALTO VERA_A.csv</div>
  <div id="resumen">Cargando datos...</div>
  <div style="margin-top:6px;">
    🏠 Vivienda<br>
    🟠 Parcela
  </div>
</div>

<script>
  const archivoCSV = "ALTO VERA_A.csv";

  const map = L.map('map').setView([-24.4, -56.4], 12);

  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
  ).addTo(map);

  L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '' }
  ).addTo(map);

  const iconoVivienda = L.divIcon({
    html: `<div style="width:28px;height:28px;border-radius:50%;background:#fdd835;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 1px 4px rgba(0,0,0,0.45);">🏠</div>`,
    className: "", iconSize: [28, 28], iconAnchor: [14, 14]
  });

  const iconoParcela = L.divIcon({
    html: `<div style="width:30px;height:30px;border-radius:50%;background:#f4511e;border:2px solid white;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:17px;box-shadow:0 1px 4px rgba(0,0,0,0.45);">P</div>`,
    className: "", iconSize: [30, 30], iconAnchor: [15, 15]
  });

  function limpiarValor(valor) {
    if (valor === undefined || valor === null) return "";
    return String(valor).trim();
  }

  function get(row, nombre) {
    if (row[nombre] !== undefined) return row[nombre];

    const buscado = nombre.trim().toLowerCase();
    const clave = Object.keys(row).find(k => k.trim().toLowerCase() === buscado);
    return clave ? row[clave] : "";
  }

  function convertirNumero(valor) {
    if (valor === undefined || valor === null || valor === "") return null;
    let texto = String(valor).trim().replace(",", ".");
    const num = parseFloat(texto);
    if (isNaN(num)) return null;
    return num;
  }

  function crearPopup(row, tipo, lat, lon) {
    const nombre = limpiarValor(get(row, "Nombres y Apellidos"));
    const cedula = limpiarValor(get(row, "Cédula"));
    const comunidad = limpiarValor(get(row, "Comunidad"));
    const modelo = limpiarValor(get(row, "Modelo"));
    const departamento = limpiarValor(get(row, "Departamento"));
    const distrito = limpiarValor(get(row, "Distrito"));
    const localidad = limpiarValor(get(row, "Localidad"));
    const telefono = limpiarValor(get(row, "Teléfono"));
    const empresa = limpiarValor(get(row, "Empresa"));
    const lote = limpiarValor(get(row, "Lote"));
    const estadoParticipante = limpiarValor(get(row, "Estado del participante"));
    const estadoMonitoreo = limpiarValor(get(row, "Estado monitoreo"));
    const prioridad = limpiarValor(get(row, "Prioridad"));
    const superficie = limpiarValor(get(row, "Superficie (Ha.)"));
    const urlRuta = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

    return `
      <div style="min-width:230px; max-width:290px;">
        <h3 style="margin:0 0 6px 0;">${nombre}</h3>
        <b>Tipo:</b> ${tipo}<br>
        <b>Cédula:</b> ${cedula}<br>
        <b>Comunidad:</b> ${comunidad}<br>
        <b>Departamento:</b> ${departamento}<br>
        <b>Distrito:</b> ${distrito}<br>
        <b>Localidad:</b> ${localidad}<br>
        <b>Teléfono:</b> ${telefono}<br>
        <b>Modelo:</b> ${modelo}<br>
        <b>Superficie:</b> ${superficie}<br>
        <b>Empresa:</b> ${empresa}<br>
        <b>Lote:</b> ${lote}<br>
        <b>Estado participante:</b> ${estadoParticipante}<br>
        <b>Estado monitoreo:</b> ${estadoMonitoreo}<br>
        <b>Prioridad:</b> ${prioridad}<br>
        <a class="btn-ruta" target="_blank" href="${urlRuta}">Cómo llegar</a>
      </div>
    `;
  }

  function agregarEtiqueta(marker, texto) {
    marker.bindTooltip(texto, {
      permanent: false,
      direction: "top",
      offset: [0, -12],
      className: "label-nombre"
    });
  }

  const grupoPuntos = L.featureGroup().addTo(map);

  Papa.parse(archivoCSV, {
    download: true,
    header: true,
    skipEmptyLines: true,
    delimiter: "",
    complete: function(results) {
      const datos = results.data;
      let totalViviendas = 0;
      let totalParcelas = 0;
      let sinCoordenadas = 0;

      console.log("Columnas detectadas:", results.meta.fields);

      datos.forEach(row => {
        const nombre = limpiarValor(get(row, "Nombres y Apellidos"));

        const latViv = convertirNumero(get(row, "Vivienda_Latitud"));
        const lonViv = convertirNumero(get(row, "Vivienda_Longitud"));

        if (latViv !== null && lonViv !== null) {
          const markerViv = L.marker([latViv, lonViv], { icon: iconoVivienda }).addTo(grupoPuntos);
          markerViv.bindPopup(crearPopup(row, "Vivienda", latViv, lonViv));
          agregarEtiqueta(markerViv, `${nombre} - Vivienda`);
          totalViviendas++;
        }

        const latPar = convertirNumero(get(row, "Parcela_Latitud"));
        const lonPar = convertirNumero(get(row, "Parcela_Longitud"));

        if (latPar !== null && lonPar !== null) {
          const markerPar = L.marker([latPar, lonPar], { icon: iconoParcela }).addTo(grupoPuntos);
          markerPar.bindPopup(crearPopup(row, "Parcela", latPar, lonPar));
          agregarEtiqueta(markerPar, `${nombre} - Parcela`);
          totalParcelas++;
        }

        if ((latViv === null || lonViv === null) && (latPar === null || lonPar === null)) {
          sinCoordenadas++;
        }
      });

      document.getElementById("resumen").innerHTML =
        `<b>Viviendas:</b> ${totalViviendas}<br><b>Parcelas:</b> ${totalParcelas}`;

      if (grupoPuntos.getLayers().length > 0) {
        map.fitBounds(grupoPuntos.getBounds(), { padding: [40, 40] });
      } else {
        alert("El CSV se leyó, pero no se encontraron coordenadas. Revisar nombres de columnas Vivienda_Latitud, Vivienda_Longitud, Parcela_Latitud y Parcela_Longitud.");
      }

      console.log("Viviendas:", totalViviendas);
      console.log("Parcelas:", totalParcelas);
      console.log("Filas sin coordenadas:", sinCoordenadas);
    },
    error: function(error) {
      alert("No se pudo leer el CSV. Verificá que el archivo se llame exactamente: ALTO VERA_A.csv");
      console.error(error);
    }
  });

  map.locate({ setView: false, watch: true, enableHighAccuracy: true });

  let marcadorUsuario = null;

  map.on('locationfound', function(e) {
    if (marcadorUsuario) {
      marcadorUsuario.setLatLng(e.latlng);
    } else {
      marcadorUsuario = L.circleMarker(e.latlng, {
        radius: 8,
        color: "#1a73e8",
        fillColor: "#1a73e8",
        fillOpacity: 0.8
      }).addTo(map).bindPopup("Mi ubicación actual");
    }
  });
</script>
</body>
</html>
